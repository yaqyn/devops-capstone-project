---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: lint
spec:
  description: This task will lint the Python source code with flake8.
  workspaces:
    - name: source
  steps:
    - name: flake8
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        python -m pip install --quiet flake8==4.0.1
        echo "Running flake8 on the source code..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics
        echo "Linting passed."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test
spec:
  description: This task will run the unit tests with nosetests.
  workspaces:
    - name: source
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: sqlite:///test.db
      script: |
        #!/usr/bin/env bash
        set -e
        python -m pip install --quiet -r requirements.txt
        echo "Running unit tests..."
        nosetests -v --with-spec --spec-color --with-coverage --cover-package=service
        echo "All tests passed."
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  description: This task will deploy the application to Kubernetes/OpenShift.
  workspaces:
    - name: source
  params:
    - name: image
      description: The container image to deploy
      type: string
  steps:
    - name: update-manifests
      image: alpine:3
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -e
        sed -i "s|image: accounts:1.0|image: $(params.image)|" deploy/accounts.yaml
        cat deploy/accounts.yaml
    - name: apply
      image: quay.io/openshift/origin-cli:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -e
        echo "Applying Kubernetes manifests..."
        kubectl apply -f deploy/postgres.yaml
        kubectl apply -f deploy/accounts.yaml
        echo "Waiting for the accounts deployment to roll out..."
        kubectl rollout status deployment/accounts --timeout=120s
        kubectl get all
